server {
    listen 80;
    server_name rds.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rds.example.com;
    root /opt/research-data-system/apps/web/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/rds.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rds.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public,immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
